<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260">
<defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b17"/><stop offset="1" stop-color="#111a36"/></linearGradient>
<linearGradient id="bdl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/>
<animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="9s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="txl" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<filter id="bll" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<clipPath id="cl"><rect width="600" height="260" rx="18"/></clipPath></defs>
<style>.t{font:800 19px 'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif}.lab{font:500 14px 'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#a3b1c6}.val{font:700 15px 'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#f1f5fb}
.lg{font:600 13px 'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#d6def0}.pc{font-weight:400;fill:#a3b1c6}.ring{font:800 28px 'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#f1f5fb}.rl{font:500 11px 'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#a3b1c6}
.st{font:400 10.5px 'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#6f8096}</style>
<g clip-path="url(#cl)"><rect width="600" height="260" fill="url(#gl)"/>
<circle cx="540" cy="30" r="90" fill="#A78BFA" opacity=".22" filter="url(#bll)"><animate attributeName="r" values="80;110;80" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="40" cy="240" r="70" fill="#22D3EE" opacity=".15" filter="url(#bll)"><animate attributeName="cx" values="40;160;40" dur="9s" repeatCount="indefinite"/></circle></g>
<rect x="1" y="1" width="598" height="258" rx="18" fill="none" stroke="url(#bdl)" stroke-width="2"/>
<text x="28" y="48" class="t" fill="url(#txl)">Most Used Languages</text>
<text x="28" y="130" class="lab">Language stats appear after the first workflow run.</text></svg>